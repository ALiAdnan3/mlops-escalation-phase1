# Pipeline: ingest -> validate -> split -> build_kb -> baseline -> train -> evaluate -> register
# Owner of this file: Member A. B and C uncomment and fill in their own stages (keep the contracts in
# section 2 of the work-division doc). Commit dvc.lock together with the code change that produced it.
stages:
  ingest:                                   # Member A
    cmd: python src/ingest.py
    deps:
      - src/ingest.py
    params:
      - ingest
    outs:
      - data/raw/bitext.parquet

  validate:                                 # Member A
    cmd: python src/validate.py
    deps:
      - src/validate.py
      - configs/schema.yaml
      - data/raw/bitext.parquet
    params:
      - validate
    outs:
      - data/interim/validated.parquet
      - reports/validation.json:
          cache: false

  split:                                    # Member B
    # run as a module (-m) so `from src.labels import ...` resolves from the repo root
    cmd: python -m src.split
    deps:
      - src/split.py
      - src/labels.py
      - configs/labels.yaml
      - configs/schema.yaml
      - data/interim/validated.parquet
    params:
      - seed
      - split
    outs:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
      - reports/split_report.json:
          cache: false

  build_kb:                                 # Member B
    cmd: python -m src.kb
    deps:
      - src/kb.py
      - src/labels.py
      - configs/labels.yaml
      - data/processed/train.parquet
      - data/interim/validated.parquet
    params:
      - seed
      - build_kb
    outs:
      - data/processed/kb.parquet

  baseline:                                 # Member B (logs MLflow run `baseline-bm25`)
    cmd: python -m src.baseline
    deps:
      - src/baseline.py
      - src/metrics.py
      - src/split.py
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
      - data/processed/kb.parquet
    params:
      - seed
      - baseline
    metrics:
      - reports/baseline_metrics.json:
          cache: false

  train:                                    # Member C
    cmd: python -m src.train
    deps:
      - src/train.py
      - src/model.py
      - src/metrics.py
      - src/split.py
      - src/baseline.py
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
      - data/processed/kb.parquet
    params:
      - seed
      - train
    metrics:
      - reports/registered_metrics.json:
          cache: false
