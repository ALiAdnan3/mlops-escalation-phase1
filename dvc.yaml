# Pipeline: ingest -> validate -> split -> build_kb -> baseline -> train -> evaluate -> register
# Owner of this file: Member A. B and C uncomment and fill in their own stages (keep the contracts in
# section 2 of the work-division doc). Commit dvc.lock together with the code change that produced it.
stages:
  ingest:                                   # Member A
    cmd: python src/ingest.py
    deps:
      - src/ingest.py
    params:
      - ingest
    outs:
      - data/raw/bitext.parquet

  validate:                                 # Member A
    cmd: python src/validate.py
    deps:
      - src/validate.py
      - configs/schema.yaml
      - data/raw/bitext.parquet
    params:
      - validate
    outs:
      - data/interim/validated.parquet
      - reports/validation.json:
          cache: false

